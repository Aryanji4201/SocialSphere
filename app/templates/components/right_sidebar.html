<div class="card shadow sidebar-card">

    <div class="card-body">

        <h5>

            <i class="bi bi-people-fill"></i>

            Suggested Users

        </h5>

        <hr>

        {% if suggested_users %}

            {% for user in suggested_users %}

            <div class="d-flex align-items-center mb-3">

                <img
                    src="https://ui-avatars.com/api/?name={{ user.username }}&background=1877f2&color=fff"
                    width="45"
                    height="45"
                    class="rounded-circle">

                <div class="ms-3 flex-grow-1">

                    <strong>

                        {{ user.username }}

                    </strong>

                    <br>

                    <small class="text-muted">

                        {{ user.email }}

                    </small>

                </div>

                <a
                    href="/follow/{{ user.id }}"
                    class="btn btn-sm btn-primary">

                    Follow

                </a>

            </div>

            {% endfor %}

        {% else %}

            <p class="text-muted">

                No suggestions available.

            </p>

        {% endif %}

        <hr>

        <h5>

            🔥 Trending

        </h5>

        <div class="mt-3">

            <span class="badge bg-primary">

                #Flask

            </span>

            <span class="badge bg-success">

                #Python

            </span>

            <span class="badge bg-dark">

                #OpenAI

            </span>

        </div>

    </div>

</div>
