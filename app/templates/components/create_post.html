<div class="card shadow create-post-card mb-4">

    <div class="card-body">

        <div class="d-flex">

            <img
                src="https://ui-avatars.com/api/?name={{ current_user.username }}&background=1877f2&color=fff"
                width="50"
                height="50"
                class="rounded-circle me-3">

            <form
                action="/create-post"
                method="POST"
                enctype="multipart/form-data"
                class="w-100">

                <textarea
                    class="form-control create-post-textarea"
                    rows="3"
                    name="content"
                    placeholder="What's on your mind, {{ current_user.username }}?"
                    required></textarea>

                <div class="d-flex justify-content-between align-items-center mt-3">

                    <div>

                        <label class="btn btn-light me-2">

                            <i class="bi bi-image-fill text-success"></i>

                            Photo

                            <input
                                type="file"
                                name="image"
                                hidden>

                        </label>

                        <button
                            type="button"
                            class="btn btn-light me-2">

                            😊 Feeling

                        </button>

                        <button
                            type="button"
                            class="btn btn-light">

                            📍 Location

                        </button>

                    </div>

                    <button
                        class="btn btn-primary px-4">

                        <i class="bi bi-send-fill"></i>

                        Post

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
