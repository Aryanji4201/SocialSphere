<div class="card mb-4">

    <div class="card-body">

        <form
            action="/create-post"
            method="POST"
            enctype="multipart/form-data">

            <textarea
                class="form-control"
                rows="3"
                name="content"
                placeholder="What's on your mind?"
                required></textarea>

            <div class="d-flex justify-content-between mt-3">

                <input
                    type="file"
                    name="image"
                    class="form-control w-50">

                <button
                    class="btn btn-primary">

                    <i class="bi bi-send-fill"></i>

                    Post

                </button>

            </div>

        </form>

    </div>

</div>
