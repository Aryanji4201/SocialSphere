<div class="card shadow sidebar-card">

    <div class="card-body text-center">

        <img
            src="https://ui-avatars.com/api/?name={{ current_user.username }}&background=1877f2&color=fff"
            width="90"
            height="90"
            class="rounded-circle mb-3">

        <h4 class="mb-1">

            {{ current_user.username }}

        </h4>

        <small class="text-muted">

            {{ current_user.email }}

        </small>

        <hr>

        <div class="row text-center">

            <div class="col">

                <h5>{{ current_user.posts|length }}</h5>

                <small>Posts</small>

            </div>

            <div class="col">

                <h5>{{ current_user.followers|length }}</h5>

                <small>Followers</small>

            </div>

            <div class="col">

                <h5>{{ current_user.following|length }}</h5>

                <small>Following</small>

            </div>

        </div>

        <hr>

        <div class="list-group list-group-flush">

            <a
                href="/"
                class="list-group-item list-group-item-action">

                <i class="bi bi-house-fill me-2"></i>

                Home

            </a>

            <a
                href="/profile/{{ current_user.id }}"
                class="list-group-item list-group-item-action">

                <i class="bi bi-person-fill me-2"></i>

                Profile

            </a>

            <a
                href="/messages"
                class="list-group-item list-group-item-action">

                <i class="bi bi-chat-dots-fill me-2"></i>

                Messages

            </a>

            <a
                href="/notifications"
                class="list-group-item list-group-item-action">

                <i class="bi bi-bell-fill me-2"></i>

                Notifications

            </a>

        </div>

    </div>

</div>
