<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SocialSphere</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg shadow-sm">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="/">

            <i class="bi bi-globe2"></i>

            SocialSphere

        </a>

        <!-- Search -->
        {% if current_user.is_authenticated %}

        <form
            class="d-flex search-box mx-auto"
            action="/search"
            method="GET">

            <input
                class="form-control"
                type="search"
                name="q"
                placeholder="Search users..."
                value="{{ request.args.get('q','') }}">

        </form>

        {% endif %}

        <!-- Right Side -->
        {% if current_user.is_authenticated %}

        <div class="d-flex align-items-center gap-4">

            <!-- Messages -->
            <a
                href="/messages"
                class="text-decoration-none">

                <i class="bi bi-chat-dots-fill nav-icon"></i>

            </a>

            <!-- Notifications -->
            <a
                href="/notifications"
                class="text-decoration-none">

                <i class="bi bi-bell-fill nav-icon"></i>

            </a>

            <!-- Profile Dropdown -->
            <div class="dropdown">

                <a
                    href="#"
                    class="d-flex align-items-center text-decoration-none dropdown-toggle"
                    data-bs-toggle="dropdown">

                    <img
                        src="https://ui-avatars.com/api/?name={{ current_user.username }}&background=1877f2&color=fff"
                        width="38"
                        height="38"
                        class="rounded-circle me-2">

                    <span class="fw-semibold text-dark">

                        {{ current_user.username }}

                    </span>

                </a>

                <ul class="dropdown-menu dropdown-menu-end shadow">

                    <li>

                        <a
                            class="dropdown-item"
                            href="/profile/{{ current_user.id }}">

                            <i class="bi bi-person-circle"></i>

                            My Profile

                        </a>

                    </li>

                    <li>

                        <a
                            class="dropdown-item"
                            href="/messages">

                            <i class="bi bi-chat-dots"></i>

                            Messages

                        </a>

                    </li>

                    <li>

                        <a
                            class="dropdown-item"
                            href="/notifications">

                            <i class="bi bi-bell"></i>

                            Notifications

                        </a>

                    </li>

                    <li>

                        <hr class="dropdown-divider">

                    </li>

                    <li>

                        <a
                            class="dropdown-item text-danger"
                            href="/logout">

                            <i class="bi bi-box-arrow-right"></i>

                            Logout

                        </a>

                    </li>

                </ul>

            </div>

        </div>

        {% endif %}

    </div>

</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
